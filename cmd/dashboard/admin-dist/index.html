        <script>
          // Early WAF gate: redirect unauthenticated visitors back to the security gateway
          ;(function(){
            try {
              if (window.location.pathname.indexOf('/dashboard') === -1) return;
              var hasJwt = document.cookie.indexOf('nz-jwt=') !== -1;
              var hasToken = false;
              try { hasToken = !!(localStorage.getItem('token') || localStorage.getItem('jwt')); } catch(_){}
              if (!hasJwt && !hasToken) {
                var p = '';
                var ck = document.cookie.match(/nz-secret-path=([^;]+)/);
                if (ck && ck[1]) { p = '/' + decodeURIComponent(ck[1].trim()); }
                else {
                  var parts = window.location.pathname.split('/').filter(Boolean);
                  if (parts.length > 0 && /^[a-zA-Z]{8}$/.test(parts[0]) && !/^(dashboard|settings|terminal|transfer)$/i.test(parts[0])) {
                    p = '/' + parts[0];
                  } else {
                    try { var s = localStorage.getItem('nz-secret-path'); if (s && /^[a-zA-Z]{8}$/.test(s)) p = '/' + s; } catch(_) {}
                  }
                }
                var cleanSearch = '';
                try {
                  var sp = new URLSearchParams(window.location.search);
                  sp.delete('redirect');
                  var qs = sp.toString();
                  if (qs) cleanSearch = '?' + qs;
                } catch(_){}
                var dest = window.location.pathname + cleanSearch;
                var target = (p || '') + '/?redirect=' + encodeURIComponent(dest);
                if (window.location.pathname + window.location.search !== target) {
                  window.location.replace(target);
                }
              }
            } catch(_) {}
          })();
        </script>
