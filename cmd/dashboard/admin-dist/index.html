        <script>
          // Early WAF gate & White Screen Auto-Recovery Guard & Secret Path Guard
          ;(function(){
            function getSecretPrefix() {
              try {
                var ck = document.cookie.match(/(?:nz-secret-path|gw-secret-path)=([^;]+)/);
                if (ck && ck[1]) { return '/' + decodeURIComponent(ck[1].trim()); }
                var parts = window.location.pathname.split('/').filter(Boolean);
                if (parts.length > 0 && /^[a-zA-Z]{8}$/.test(parts[0]) && !/^(dashboard|settings|terminal|transfer)$/i.test(parts[0])) {
                  return '/' + parts[0];
                }
                var s = localStorage.getItem('gw-secret-path') || localStorage.getItem('nz-secret-path');
                if (s && /^[a-zA-Z]{8}$/.test(s)) return '/' + s;
              } catch (_) {}
              return '';
            }
            window.__getSecretPrefix = getSecretPrefix;

            // Intercept window.open to ensure secret prefix is prepended to dashboard/terminal popups
            var _origOpen = window.open;
            if (typeof _origOpen === 'function') {
              window.open = function(url, target, features) {
                if (typeof url === 'string') {
                  var p = getSecretPrefix();
                  if (p && url.indexOf(p) !== 0) {
                    if (url.indexOf('/dashboard') === 0 || url.indexOf('/terminal') === 0) {
                      url = p + url;
                    }
                  }
                }
                return _origOpen.call(this, url, target, features);
              };
            }

            var RELOAD_KEY = "gw_admin_white_screen_recovery";
            var MAX_RELOAD_INTERVAL = 8000;

            function canAutoRecover() {
              try {
                var last = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
                return Date.now() - last > MAX_RELOAD_INTERVAL;
              } catch (_e) {
                return true;
              }
            }

            function markAutoRecover() {
              try {
                sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
              } catch (_e) {}
            }

            // 1. Early WAF gate: redirect unauthenticated visitors to dashboard login
            try {
              if (window.location.pathname.indexOf('/dashboard') !== -1 && window.location.pathname.indexOf('/dashboard/login') === -1) {
                var hasJwt = document.cookie.indexOf('nz-jwt=') !== -1 || document.cookie.indexOf('gw-jwt=') !== -1;
                var hasToken = false;
                try { hasToken = !!(localStorage.getItem('token') || localStorage.getItem('jwt') || localStorage.getItem('gw-token')); } catch(_){}
                if (!hasJwt && !hasToken) {
                  var p = getSecretPrefix();
                  var target = (p || '') + '/dashboard/login';
                  if (window.location.pathname !== target) {
                    window.location.replace(target);
                    return;
                  }
                }
              }
            } catch(_) {}

            // 2. Chunk load error auto-recovery
            function isChunkError(msg) {
              if (!msg) return false;
              return /Failed to fetch dynamically imported module|Loading chunk [0-9]+ failed|Importing a module script failed/i.test(msg);
            }

            window.addEventListener('error', function(e) {
              var msg = (e && (e.message || (e.error && e.error.message))) || '';
              if (isChunkError(msg) && canAutoRecover()) {
                markAutoRecover();
                window.location.reload();
              }
            });

            window.addEventListener('unhandledrejection', function(e) {
              var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
              if (isChunkError(msg) && canAutoRecover()) {
                markAutoRecover();
                window.location.reload();
              }
            });

            // 3. Tab wakeup white screen detection
            function checkWhiteScreenOnWake() {
              if (document.hidden) return;
              window.setTimeout(function() {
                var root = document.getElementById('root');
                var isBlank = root && (!root.childNodes || root.childNodes.length === 0 || root.offsetHeight === 0);
                if (isBlank && canAutoRecover()) {
                  markAutoRecover();
                  window.location.reload();
                }
              }, 700);
            }

            document.addEventListener('visibilitychange', function() {
              if (!document.hidden) checkWhiteScreenOnWake();
            });
            window.addEventListener('focus', checkWhiteScreenOnWake);
          })();
        </script>
