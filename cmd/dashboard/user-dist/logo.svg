<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="8" />

  <!-- Background Grid Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" stroke-dasharray="6,8" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="2" />

  <!-- Glowing Emblem: Server Cloud / Shield Matrix -->
  <g filter="url(#glow)">
    <!-- Top Server Layer -->
    <rect x="136" y="140" width="240" height="56" rx="16" fill="url(#primaryGrad)" />
    <circle cx="170" cy="168" r="7" fill="#ffffff" />
    <circle cx="196" cy="168" r="7" fill="rgba(255,255,255,0.7)" />
    <line x1="280" y1="168" x2="346" y2="168" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Middle Server Layer -->
    <rect x="136" y="228" width="240" height="56" rx="16" fill="url(#primaryGrad)" />
    <circle cx="170" cy="256" r="7" fill="#ffffff" />
    <circle cx="196" cy="256" r="7" fill="rgba(255,255,255,0.7)" />
    <line x1="280" y1="256" x2="346" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Bottom Server Layer -->
    <rect x="136" y="316" width="240" height="56" rx="16" fill="url(#primaryGrad)" />
    <circle cx="170" cy="344" r="7" fill="#10b981" />
    <circle cx="196" cy="344" r="7" fill="#38bdf8" />
    <line x1="280" y1="344" x2="346" y2="344" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Connecting Bus Nodes -->
    <path d="M256 196 L256 228 M256 284 L256 316" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Pulse Status Core Ring -->
  <circle cx="346" cy="344" r="14" fill="#10b981" filter="url(#glow)" />
  <circle cx="346" cy="344" r="6" fill="#ffffff" />
</svg>